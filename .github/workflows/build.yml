name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write # para publicar cada versión en Releases (de ahí se actualiza la app)
    env:
      MOODY_BUILD: ${{ github.run_number }}
      MOODY_KEYSTORE_PASSWORD: ${{ secrets.MOODY_KEYSTORE_PASSWORD }}
      # en main y con la clave de firma se publica en Releases; si no, el APK queda como artefacto
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOODY_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/spotify

      # el núcleo de Spotify (librespot); sin él el módulo Spotify solo dice que no está disponible
      - name: Build Spotify core
        working-directory: native/spotify
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 24 -o ../../app/src/main/jniLibs build --release
          ls -la ../../app/src/main/jniLibs/*

      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary
          mkdir -p dist
          cp app/build/outputs/apk/universalGms/release/*.apk dist/moody.apk

      - name: Publish release (the app finds it and updates itself)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Cambios:"
            git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d'
          } > notes.md
          gh release create "moody-$MOODY_BUILD" dist/moody.apk \
            --title "Moody 8.5.0 build#$MOODY_BUILD" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Aviso si falta la clave de firma
        if: github.ref == 'refs/heads/main' && env.MOODY_KEYSTORE_PASSWORD == ''
        run: echo "::warning::Falta el secreto MOODY_KEYSTORE_PASSWORD (ver scripts/crear-clave.sh): no se publicó la versión para el actualizador."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moody
          path: dist/moody.apk
          # a debug apk is only for trying the build, after a week it's just eating actions storage
          retention-days: 7