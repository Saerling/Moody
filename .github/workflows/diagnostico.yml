# diagnóstico: comprueba contra los servicios reales lo que usan la sincronización y el inicio, y abre la app en un
# emulador para ver si arranca, qué muestra y qué registra. se lanza a mano (Actions → Diagnóstico → Run workflow)
# o al tocar este archivo. con el secreto YT_COOKIE también lee la biblioteca de tu cuenta de YouTube Music.
name: Diagnóstico

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml', 'scripts/ci/**', 'providers/innertube/src/test/**']

jobs:
  api:
    name: Servicios en vivo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: YouTube Music (sin cuenta y con tu cuenta si hay YT_COOKIE)
        env:
          LIVE: '1'
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
        run: |
          chmod +x gradlew
          ./gradlew :providers:innertube:testDebugUnitTest --tests '*LiveSmokeTest*' --console=plain --no-configuration-cache 2>&1 | tee api.log
          grep -E "^(OK|FAIL) " api.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api, path: api.log, retention-days: 7 }

  emulator:
    name: App en emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bajar el último APK compilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n moody -D dist
          ls -la dist
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci/emulator-walk.sh emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator, path: emulator-out, retention-days: 7 }
